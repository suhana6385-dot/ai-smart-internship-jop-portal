version: "3.9"

services:
  # ----------------------------------------------------------------------------
  # 1. MongoDB Database
  # ----------------------------------------------------------------------------
  mongo:
    image: mongo:7
    container_name: job-portal-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  # ----------------------------------------------------------------------------
  # 2. Python FastAPI AI Microservice
  # ----------------------------------------------------------------------------
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: job-portal-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - DEBUG=false
    volumes:
      - ai_uploads:/app/uploads
      - ai_logs:/app/logs
    networks:
      - app-network

  # ----------------------------------------------------------------------------
  # 3. Node.js + Express Backend Gateway
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: job-portal-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/campus_placement
      - AI_SERVICE_URL=http://ai-service:8000
      - AI_SERVICE_TIMEOUT_MS=15000
      - CLIENT_URL=http://localhost:3000
      - JWT_SECRET=change_this_super_secret_jwt_key_in_production
      - JWT_EXPIRES_IN=7d
      - JWT_REFRESH_SECRET=change_this_super_secret_refresh_key_in_production
      - JWT_REFRESH_EXPIRES_IN=30d
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=${SMTP_USER:-placeholder@gmail.com}
      - SMTP_PASS=${SMTP_PASS:-placeholder}
      - MAIL_FROM="Campus Placement <suhana6385@gmail.com>"
      - MAX_FILE_SIZE_MB=5
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    depends_on:
      - mongo
      - ai-service
    networks:
      - app-network

  # ----------------------------------------------------------------------------
  # 4. React 19 + Vite Frontend SPA (Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:5000/api/v1
        - VITE_APP_NAME=AI Smart Internship & Job Recommendation Portal
    container_name: job-portal-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mongo_data:
  ai_uploads:
  ai_logs:
  backend_uploads:
  backend_logs:

networks:
  app-network:
    driver: bridge
