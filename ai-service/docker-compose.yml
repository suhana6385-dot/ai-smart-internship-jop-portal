version: "3.9"

services:
  ai-service:
    build: .
    container_name: ai-job-portal-service
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB_NAME=ai_job_portal
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: ai-job-portal-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
